name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/huanye.jks \
            -alias huanye \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass huanye2026 -keypass huanye2026 \
            -dname "CN=Wuliao, OU=Huanye, O=Wuliao, L=CN, ST=CN, C=CN"
          ls -la keystore/

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Copy APK
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huanye-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
