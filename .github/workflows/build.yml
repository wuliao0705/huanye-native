name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Show project tree
        run: |
          echo "--- 项目结构 ---"
          find . -name "*.kts" -o -name "*.kt" -o -name "*.json" | head -30
          echo "--- assets ---"
          ls -la app/src/main/assets/ || true

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Copy APK
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huanye-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
